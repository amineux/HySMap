name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Ubuntu C++20 + Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git python3-dev python3
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHYSMAP_BUILD_TESTS=ON -DHYSMAP_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke
        run: |
          ./build/hysmap version
          ./build/hysmap generate --preset potjans --neurons 48 --seed 1 --out /tmp/net.json
          ./build/hysmap map --input /tmp/net.json --mesh 4 --mapper hysmap-seeded --seed 1 --json
          ./build/hysmap map --input /tmp/net.json --mesh 4 --seed-strategy random --refine greedy --seed 1
          ./build/hysmap export --input /tmp/net.json --mesh 4 --mapper activity-qap --format loihi-json --out /tmp/loihi.json
          ./build/hysmap demo --mesh 4 --neurons 48 --seed 1 --mapper activity-qap --threads 2
          test -s /tmp/loihi.json
          grep -q hysmap-loihi-style /tmp/loihi.json
      - name: Python binding smoke
        run: |
          PYTHONPATH=build python3 -c "import hysmap; print(hysmap.__version__); g=hysmap.generate_snn(hysmap.GeneratorConfig()); print(g.neuron_count())"
          PYTHONPATH=build python3 python/examples/quickstart.py
      - name: Intuition examples
        run: python3 scripts/intuition.py
